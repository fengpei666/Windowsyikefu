name: build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 构建与测试
  test:
    name: 构建与测试
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原依赖
        run: dotnet restore Windowsyikefu.Desktop.sln

      - name: 编译
        run: dotnet build Windowsyikefu.Desktop.sln -c Release --no-restore

      - name: 单元测试
        run: dotnet test tests/Windowsyikefu.Tests/Windowsyikefu.Tests.csproj -c Release --no-build --verbosity normal

  # ---------------------------------------------------------------- 打 tag 时出安装包并发布
  release:
    name: 打包并发布
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: 发布自包含程序并生成安装包
        run: pwsh -ExecutionPolicy Bypass -File .\build-setup.ps1

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/kefu_setup.exe
          generate_release_notes: true
          draft: false
