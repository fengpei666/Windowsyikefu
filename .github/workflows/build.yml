name: build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 构建与测试
  test:
    name: 构建与测试
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 环境信息
        run: dotnet --info

      # 注意：这里故意不拆出单独的 restore 步骤、也不加 --no-restore。
      # 本项目 Release 配置是 SelfContained，按 Debug 语义做的还原不会带运行时包，
      # 缺了它 build 会失败；交给 build 自己还原最稳。
      - name: 编译（Release）
        shell: pwsh
        run: |
          $out = dotnet build Windowsyikefu.Desktop.sln -c Release --nologo 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $out | Select-String -Pattern 'error|MSB\d{4}|NETSDK\d{4}' |
              Select-Object -First 15 |
              ForEach-Object { Write-Host "::error title=BuildFailure::$($_.Line.Trim())" }
            exit 1
          }

      # 这里不能用 --no-build：走 sln 构建时产物落在 bin\x64\Release，
      # 而直接对项目跑 test 时产物落在 bin\Release，加了它会找不到测试程序集。
      - name: 单元测试
        shell: pwsh
        run: |
          $out = dotnet test tests/Windowsyikefu.Tests/Windowsyikefu.Tests.csproj `
                   -c Release --nologo --verbosity normal 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $out | Select-String -Pattern 'FAIL|失败' |
              Select-Object -First 15 |
              ForEach-Object { Write-Host "::error title=TestFailure::$($_.Line.Trim())" }
            exit 1
          }

  # ---------------------------------------------------------------- 打 tag 时出安装包并发布
  release:
    name: 打包并发布
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: 发布自包含程序并生成安装包
        shell: pwsh
        run: |
          $out = pwsh -ExecutionPolicy Bypass -File .\build-setup.ps1 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $out | Select-String -Pattern 'error|错误|MSB\d{4}|NETSDK\d{4}' |
              Select-Object -First 15 |
              ForEach-Object { Write-Host "::error title=PackageFailure::$($_.Line.Trim())" }
            exit 1
          }

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/kefu_setup.exe
          generate_release_notes: true
          draft: false
